<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="chips.gif">
    <link rel="stylesheet" href="app.css">
    <title>ESCAPA DE CHIPS</title>
</head>
<body>

    <div class="contenido-principal">

        <div class="pantalla">

            <div class="juego">
                <h1>ESCAPA DE CHIPS</h1>

                <div id="game-area">
                    <div id="player" class="character"></div>
                    <div id="beyonce" class="character"></div>
                </div>    
            </div>

            <div class="config">

                <div class="puntaje">
                    <span class="puntaje-label">PUNTOS</span>
                    <span id="puntaje-val" class="puntaje-numero">0</span>
                </div>

                <div class="config-item">
                    <label> Velocidad del Jugador</label>
                    <div class="range-group">
                        <input type="range" id="input-player-speed" min="10" max="100" value="40">
                        <span id="val-player-speed" class="val-badge">40</span>
                    </div>
                </div>

                
                <div class="config-item">
                    <label> Velocidad del Enemigo</label>
                    <div class="range-group">
                        <input type="range" id="input-enemy-speed" min="1" max="10" value="1">
                        <span id="val-enemy-speed" class="val-badge">1</span>
                    </div>
                </div>

                <label >Tu botana:</label>

                <div class="radio-imagenes">
                   
                    <input type="radio" id="personaje1" name="personaje" value="rufflesAzules" checked>
                    <label for="personaje1">
                        <img src="ruffles2.png">
                    </label>

                    
                    <input type="radio" id="personaje2" name="personaje" value="rufflesVerdes">
                    <label for="personaje2">
                        <img src="ruffles-queso.png">
                    </label>

                    <input type="radio" id="personaje3" name="personaje" value="rufflesRojas">
                    <label for="personaje3">
                        <img src="ruffles-roja.png">
                    </label>
                </div>

                <button class="btn-jugar" >Jugar</button>

            </div>
        </div>
    </div>

    <script type="text/javascript" src="app.js"></script>
</body>
</html>
